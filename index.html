<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikki's Olive Press</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              olive: {
                bright: '#76E64B', // Bright Neon/Lime Green for location
                light: '#84CC16', // Brighter Green (Lime-500) for buttons/highlights
                DEFAULT: '#556B2F',
                dark: '#E8E8D8', // Light text for Dark Mode
              },
              cream: '#0C110F', // Dark Background
              gold: '#D4AF37', // Brand Gold
              surface: '#161F1A', // Dark Surface
            },
            fontFamily: {
              serif: ['"Playfair Display"', '"Amiri"', 'serif'],
              sans: ['"Lato"', '"Cairo"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0C110F;
        color: #E8E8D8;
        font-family: 'Lato', 'Cairo', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Playfair Display', 'Amiri', serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body class="bg-[#0C110F] text-[#E8E8D8] font-sans">
    <div id="root"></div>
    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import { Droplets, MapPin, History, Award } from 'lucide-react';

        const App = () => (
            <div className="min-h-screen">
                {/* Hero section exactly like Google AI Studio */}
                <header className="max-w-6xl mx-auto py-24 px-6 text-center border-b border-[#D4AF37]/10">
                    <h1 className="text-[#D4AF37] text-7xl font-serif mb-4 tracking-tight">Bikki's Olive Press</h1>
                    <p className="text-2xl text-[#E8E8D8]/60 font-light tracking-widest uppercase">Pure Liquid Gold</p>
                </header>

                {/* Main Heritage content */}
                <main className="max-w-4xl mx-auto py-20 px-6">
                    <div className="grid md:grid-cols-2 gap-12 items-center">
                        <div className="space-y-6">
                            <div className="flex items-center gap-4 text-[#D4AF37]">
                                <History size={20} />
                                <span className="text-xs font-bold tracking-widest uppercase">Since 2006</span>
                            </div>
                            <h2 className="text-4xl font-serif text-[#D4AF37]">Artisan Excellence</h2>
                            <p className="text-lg leading-relaxed text-[#E8E8D8]/80">
                                Founded by <span className="text-[#D4AF37]">Mohammed Bikki</span>, our press in Tiznit continues a legacy of premium quality and traditional craftsmanship.
                            </p>
                        </div>
                        <div className="bg-[#161F1A] p-10 rounded-3xl border border-[#D4AF37]/20 shadow-2xl">
                            <div className="flex items-center gap-4 mb-4 text-[#D4AF37]">
                                <MapPin size={24} />
                                <span className="text-xl font-semibold text-[#E8E8D8]">Tiznit, Morocco</span>
                            </div>
                            <p className="text-sm italic opacity-50 italic">"Where tradition meets the desert sun."</p>
                        </div>
                    </div>
                </main>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
